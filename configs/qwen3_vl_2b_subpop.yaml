model:
  key: "qwen3_vl_2b"              # checkpoints/subpop/qwen3_vl_2b/subpop, same backbone name as the WVS track
  id: "Qwen/Qwen3-VL-2B-Thinking"
  modality: "vision_text"
  backend: "hf"                  # auto-detects cuda > mps > cpu at runtime
  dtype: "bfloat16"
  image_max_pixels: 200704       # 448×448, identical to qwen3_vl_2b.yaml; no image reaches this run

condition: "subpop"

data:
  format: "subpop"
  val_ratio: 0.1                 # Suh et al.: questions split 0.9 / 0.1, every subpopulation of a question on one side
  split_seed: 42
  exclude_related_items: false   # Suh et al. protocol: every SubPOP-Train question, the related ones are logged

lora:                            # Suh et al., subpop/train/configs/peft.py
  r: 8
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

training:                        # Suh et al., README fine-tuning command
  batch_size: 8
  gradient_accumulation: 16      # effective batch 128
  max_epochs: 50
  learning_rate: 2.0e-4
  lr_schedule: "cosine"
  warmup_steps: 0.1              # below 1 the Trainer reads it as a ratio: their warmup_ratio of 0.1
  early_stopping_patience: 10    # evaluations, one per epoch; they run all 50 and keep the best
  early_stopping_min_epochs: 5
  max_seq_len: 320               # longest QA-steered prompt is 312 tokens here; prompts are never truncated
  logging_steps: 25
  eval_steps: 500                # one epoch is 500 optimizer steps at 63,930 rows
  save_steps: 500
  save_total_limit: 3
  max_grad_norm: 1.0             # they do not clip; 1.0 is the Trainer default
  gradient_checkpointing: false

mlflow:
  experiment: "culture_mllm_subpop_training"
  tracking_uri: "http://127.0.0.1:5000"
